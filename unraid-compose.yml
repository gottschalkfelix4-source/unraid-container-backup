# DockGuard – Beispiel-Compose für Unraid (Compose Manager) oder Docker-CLI.
# Minimal-Setup: Alle Einstellungen (Ziel SMB/S3, Zeitplan, Aufbewahrung,
# Ausschlüsse, Login) erfolgen in der Web-UI und werden in /config/settings.json
# gespeichert. Die unten auskommentierten Env-Werte dienen nur als optionale
# Defaults für den Erststart.
# Alternativ: Unraid-Template template/dockguard.xml verwenden.
services:
  dockguard:
    # Fertiges Image aus der GitHub Container Registry (kein lokaler Build nötig).
    # Lokal selbst gebaut (./build.sh): gleicher Name, daher einfach austauschbar.
    image: ghcr.io/gottschalkfelix4-source/unraid-container-backup:latest
    container_name: dockguard
    ports:
      - "8080:8080"
    volumes:
      # Docker-API (erfolgt in der Web-UI) – erforderlich
      - /var/run/docker.sock:/var/run/docker.sock
      # Einstellungen + rclone-Konfiguration – erforderlich
      - /mnt/user/appdata/dockguard:/config
      # Nur für One-Click-Restore erforderlich (Daten/Template/Volumes zurückschreiben)
      - /mnt/user:/mnt/user
      - /boot/config:/boot/config
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    # environment:
    #   --- Optionale Defaults (ersetzt alles in der Web-UI) ---
    #   - BACKUP_SCHEDULE=0 3 * * *
    #   - BACKUP_KEEP=7
    #   - BACKUP_PARALLEL=2
    #   - EXCLUDE_CONTAINERS=dockguard
    #   - RCLONE_BWLIMIT=8M
    #   - VERIFY_UPLOAD=1
    #   --- Optionaler Login für die Web-UI ---
    #   - WEB_USER=admin
    #   - WEB_PASSWORD=meinpasswort
    restart: unless-stopped
